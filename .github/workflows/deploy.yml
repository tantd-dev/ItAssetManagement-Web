name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a running deploy: killing the SSH session mid-recreate leaves the web down
# and half-replaced containers behind. A newer push waits and deploys right after.
concurrency:
  group: it-asset-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_PATH: ${{ secrets.VPS_APP_PATH }}

    steps:
      - name: Check deploy secrets
        shell: bash
        run: |
          for name in VPS_HOST VPS_USER APP_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret for $name (VPS_HOST, VPS_USER, VPS_APP_PATH, VPS_SSH_KEY are required)"
              exit 1
            fi
          done

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy via SSH
        shell: bash
        run: |
          set -euo pipefail
          # Keepalives stop the connection being dropped while the image builds silently.
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            sudo git config --global --add safe.directory '$APP_PATH'
            cd '$APP_PATH'
            sudo git pull --ff-only origin main
            TAG=\$(sudo git rev-parse --short HEAD)
            sudo env TAG=\$TAG bash ./deploy.sh
          "
