# Rotated container logs: Docker keeps them forever by default and fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-50m}
    max-file: '${LOG_MAX_FILE:-5}'

services:
  web:
    image: it-asset-web:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in .env}
    environment:
      PORT: 3000
    # Bound to loopback: the reverse proxy (Nginx) is the only thing that should reach it.
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    cpus: ${WEB_CPUS:-1}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging
    restart: unless-stopped
