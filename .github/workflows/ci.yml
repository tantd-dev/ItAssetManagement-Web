name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: it-asset-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Check the Docker image builds
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://example.com/api --tag it-asset-web:ci .
