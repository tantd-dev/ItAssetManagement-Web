name: Notify on Workflow Completion

on:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_commit.message }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_TOKEN / TELEGRAM_CHAT_ID not set, skipping."
            exit 0
          fi
          case "$CONCLUSION" in
            success) status="✅ Success" ;;
            failure) status="❌ Failure" ;;
            cancelled) status="⚪ Cancelled" ;;
            *) status="❔ $CONCLUSION" ;;
          esac
          first_line=$(printf '%s' "$COMMIT" | head -n 1)
          text=$(printf 'Workflow notification\n\nRepository: %s\nWorkflow: %s (run #%s)\nBranch: %s\nCommit: %s\nStatus: %s\n\n%s' \
            "$REPOSITORY" "$WORKFLOW" "$RUN_NUMBER" "$BRANCH" "$first_line" "$status" "$RUN_URL")
          # Plain text on purpose: commit messages break Markdown parsing.
          curl --fail --silent --show-error --output /dev/null \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
